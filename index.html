<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Özel Güvenli Araç IPTV Oynatıcı</title>
    <style>
        /* DIŞARIYA BAĞIMLILIĞI OLMAYAN KIRILMAZ TASARIM MOTORU */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        header {
            text-align: center;
            padding: 5px 0;
            border-bottom: 1px solid #1e293b;
        }

        header h1 {
            font-size: 20px;
            color: #3b82f6;
            font-weight: 700;
        }

        /* İki Sekmeli Tab Menü Tasarımı */
        .tabs-header {
            display: flex;
            background-color: #151f32;
            border: 1px solid #243552;
            border-radius: 8px;
            padding: 4px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #94a3b8;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: #fff;
            background-color: #2563eb;
        }

        .tab-body {
            display: none;
            background-color: #151f32;
            border: 1px solid #243552;
            border-radius: 8px;
            padding: 15px;
        }

        .tab-body.active {
            display: block;
        }

        .form-group {
            margin-bottom: 8px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        label {
            display: block;
            font-size: 10px;
            color: #94a3b8;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            background-color: #0b0f19;
            border: 1px solid #334155;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            color: white;
            background-color: #2563eb;
            margin-top: 5px;
        }

        .btn-action:hover { background-color: #1d4ed8; }

        .status-strip {
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            display: block;
            background-color: rgba(30, 41, 59, 0.5);
            border: 1px solid #334155;
            color: #94a3b8;
        }

        /* Oynatıcı Düzeni */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 1024px) {
            .main-grid { grid-template-columns: 1.8fr 1.2fr; }
        }

        .player-box {
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #243552;
        }

        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
        }

        .player-info {
            background-color: #151f32;
            padding: 10px;
            font-size: 13px;
            border-top: 1px solid #243552;
        }

        /* Sağ Kanal Listesi */
        .sidebar-box {
            background-color: #151f32;
            border: 1px solid #243552;
            border-radius: 8px;
            padding: 12px;
            height: 420px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .count-lbl {
            background-color: #243552;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            color: #cbd5e1;
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .channel-row {
            width: 100%;
            text-align: left;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            padding: 12px;
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-row:hover {
            background-color: rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
            color: #fff;
        }

        .channel-row.active {
            background-color: #2563eb;
            color: #fff;
            font-weight: bold;
        }

        .empty-info {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🚗 Özel Güvenli Araç IPTV Oynatıcı</h1>
        </header>

        <!-- SEKMELİ SEÇİM BUTONLARI -->
        <div class="tabs-header">
            <button class="tab-btn active" onclick="changeTab(event, 'tab-m3u')">🔗 M3U URL Girişi</button>
            <button class="tab-btn" onclick="changeTab(event, 'tab-xtream')">🔐 Xtream API Girişi</button>
        </div>

        <!-- M3U PANELİ -->
        <div id="tab-m3u" class="tab-body active">
            <div class="form-group">
                <label>Oynatma Listesi Linki (M3U)</label>
                <input type="text" id="m3uInput" placeholder="https://site.com">
            </div>
            <button class="btn-action" onclick="fetchM3U()">Listeyi Yükle</button>
        </div>

        <!-- XTREAM PANELİ -->
        <div id="tab-xtream" class="tab-body">
            <div class="form-group">
                <label>Sunucu Adresi (Host)</label>
                <input type="text" id="xtreamHost" placeholder="http://sunucuadresi.com:8080" value="http://g41s12.com">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="xtreamUser" placeholder="Username" value="x22a72a44v85">
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="xtreamPass" placeholder="Password" value="719000">
                </div>
            </div>
            <button class="btn-action" onclick="fetchXtream()">Giriş Yap ve Listele</button>
        </div>

        <!-- DURUM BİLGİ ALANI -->
        <div id="statusLabel" class="status-strip">Sistem Güvenli Modda Hazır.</div>

        <!-- ANA SİSTEM DÜZENİ -->
        <div class="main-grid">
            <div class="player-box">
                <video id="iptvVideo" controls autoplay playsinline></video>
                <div class="player-info" id="playingLabel">
                    Yayın: <span style="color: #60a5fa;">Seçilmedi</span>
                </div>
            </div>

            <div class="sidebar-box">
                <div class="sidebar-head">
                    <h3>Kanal Listesi</h3>
                    <span class="count-lbl" id="totalCount">0 Kanal</span>
                </div>
                <input type="text" id="searchBox" oninput="filterChannels()" placeholder="Kanal ismi ara...">
                <div class="list-container" id="channelListDom">
                    <div class="empty-info">Bilgilerinizi girip listenizi yükleyin.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var cacheChannels = [];
        var videoPlayer = document.getElementById('iptvVideo');

        // Sekme Kontrol Mekanizması
        function changeTab(e, id) {
            var bodies = document.getElementsByClassName("tab-body");
            for (var i = 0; i < bodies.length; i++) bodies[i].classList.remove("active");
            var btns = document.getElementsByClassName("tab-btn");
            for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
            document.getElementById(id).classList.add("active");
            e.currentTarget.classList.add("active");
        }

        function setStatus(txt, err) {
            var el = document.getElementById('statusLabel');
            el.innerText = txt;
            el.style.borderColor = err ? '#ef4444' : '#3b82f6';
            el.style.color = err ? '#fca5a5' : '#93c5fd';
            el.style.backgroundColor = err ? 'rgba(239, 68, 68, 0.15)' : 'rgba(59, 130, 246, 0.15)';
        }

        // M3U Yükleme Motoru
        function fetchM3U() {
            var url = document.getElementById('m3uInput').value.trim();
